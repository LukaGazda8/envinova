<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envinova Doklady – faktúry, cenové ponuky a objednávky</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" integrity="sha384-fCAW/rDWORTbQXSiB7mOg0QtQ5c+r0f544y6XoKjuVva0nMBlCpNUjiFeG5iMdS3" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <span class="brand-mark">E</span>
                <span class="brand-text">Envinova<small>doklady</small></span>
            </div>
            <nav class="side-nav">
                <a href="#/prehlad" data-route="prehlad"><span>&#128202;</span> Prehľad</a>
                <a href="#/faktura" data-route="faktura"><span>&#128196;</span> Faktúry</a>
                <a href="#/ponuka" data-route="ponuka"><span>&#128203;</span> Cenové ponuky</a>
                <a href="#/objednavka" data-route="objednavka"><span>&#128230;</span> Objednávky</a>
                <a href="#/kontakty" data-route="kontakty"><span>&#128101;</span> Kontakty</a>
                <a href="#/cennik" data-route="cennik"><span>&#127991;</span> Cenník položiek</a>
                <a href="#/nastavenia" data-route="nastavenia"><span>&#9881;</span> Nastavenia</a>
            </nav>
            <div class="side-footer">
                <button type="button" class="btn-secondary btn-block" data-action="export-data">&#128190; Záloha údajov</button>
                <button type="button" class="btn-secondary btn-block" data-action="import-data">&#128194; Obnoviť zálohu</button>
                <input type="file" id="importFile" accept="application/json" class="hidden">
            </div>
        </aside>

        <div class="content">
            <header class="topbar">
                <button type="button" class="btn-icon menu-toggle" data-action="toggle-sidebar" title="Menu">&#9776;</button>
                <h1 id="pageTitle">Prehľad</h1>
                <div class="topbar-actions">
                    <button type="button" class="btn-primary" data-action="new" data-type="faktura">+ Faktúra</button>
                    <button type="button" class="btn-secondary" data-action="new" data-type="ponuka">+ Ponuka</button>
                    <button type="button" class="btn-secondary" data-action="new" data-type="objednavka">+ Objednávka</button>
                </div>
            </header>

            <main class="view" id="view"></main>

            <footer class="site-footer">
                <p>Envinova Doklady &copy; 2026 – faktúry, cenové ponuky a objednávky. Údaje sú uložené vo vašom prehliadači.</p>
            </footer>
        </div>
    </div>

    <!-- Editor dokladu -->
    <div class="overlay hidden" id="editorOverlay">
        <div class="overlay-panel">
            <header class="overlay-header">
                <h2 id="editorTitle">Nový doklad</h2>
                <div class="overlay-actions">
                    <button type="button" class="btn-secondary" data-action="editor-preview">&#128065; Náhľad</button>
                    <button type="button" class="btn-secondary" data-action="editor-pdf">&#128229; PDF</button>
                    <button type="button" class="btn-primary" data-action="editor-save">&#128190; Uložiť</button>
                    <button type="button" class="btn-close" data-action="editor-close" title="Zavrieť">&#10005;</button>
                </div>
            </header>
            <div class="overlay-body" id="editorBody"></div>
        </div>
    </div>

    <!-- Modálne okno (náhľad, kontakt, položka cenníka) -->
    <div class="modal hidden" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Náhľad</h3>
                <button type="button" class="btn-close" data-action="modal-close">&#10005;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <div class="toast-container" id="toasts"></div>

    <script src="js/store.js"></script>
    <script src="js/calc.js"></script>
    <script src="js/pdf.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/views.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
